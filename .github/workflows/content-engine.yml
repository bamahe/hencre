name: HenCRE Content Engine

on:
  schedule:
    - cron: '0 12 */3 * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  publish-content:
    runs-on: ubuntu-latest
    # Raised from 10: this job now runs a full production build as a gate
    # before pushing, on top of generation.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - name: Generate and publish content
        run: npx tsx scripts/content-engine.ts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # Gate: build the site with the newly generated pages BEFORE pushing.
      # If a generated page doesn't compile, this step fails, the workflow
      # stops, and nothing is committed — the runner is ephemeral so the bad
      # pages are discarded. Previously a bad batch pushed straight through
      # and broke production deploys until the next run happened to fix it.
      - name: Verify generated pages compile
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "No changes" || (git commit -m "Auto-publish content [skip ci]" && git push)
